<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Biz Partner Hub</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-body">
    <div class="auth-card">
        <div class="logo-area">
            <a href="index.html" style="color: inherit; text-decoration: none;">
                <i class="fa-solid fa-house-lock"></i>
                <h2>Welcome back</h2>
            </a>
            <p>Sign in to your partner account</p>
        </div>

        <form action="dashboard.html">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="you@company.com" required>
            </div>
            
            <div class="form-group">
                <label>
                    Password
                    <a href="#" class="forgot-link">Forgot?</a>
                </label>
                <input type="password" placeholder="••••••••" id="login-pass" required>
                <i class="fa-solid fa-eye password-toggle" onclick="togglePass()"></i>
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
            New to the Hub? <a href="register.html">Register</a>
        </div>
    </div>
    </div>

    <script>
        function togglePass() {
            const pass = document.getElementById('login-pass');
            const icon = event.target;
            if (pass.type === 'password') {
                pass.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pass.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>

</body>
</html>
